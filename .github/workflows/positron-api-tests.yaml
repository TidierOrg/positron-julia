name: Positron API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  POSITRON_CHANNEL: stable

jobs:
  test:
    name: Positron API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Runtime discovery only surfaces a Julia runtime when one is on PATH, so
      # install Julia before launching Positron (same version as the existing
      # julia-runtime-tests job in ci.yml).
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      # Cache the Positron download, keyed by day so new stable builds are
      # picked up within 24 hours.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .positron-test
          key: positron-${{ runner.os }}-${{ env.POSITRON_CHANNEL }}-${{ steps.get-date.outputs.date }}

      - run: npm ci

      - name: Run Positron API tests
        uses: posit-dev/setup-positron@v1
        with:
          positron-channel: ${{ env.POSITRON_CHANNEL }}
          # Positron is an Electron app and needs a display server on Linux.
          run: xvfb-run -a npm run test-positron

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .positron-test
          key: positron-${{ runner.os }}-${{ env.POSITRON_CHANNEL }}-${{ steps.get-date.outputs.date }}
